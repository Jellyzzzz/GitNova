# Merge into the generated release-1.1.0 config.
# Native Linux, lifecycle service and Docker Engine on the same host.
[server]
# Same-host GitNova can use loopback; separate trusted hosts require a private
# listener, authentication and firewall policy. Never expose management publicly.
host = "127.0.0.1"
port = 8090
api_key = "REPLACE_WITH_RANDOM_SECRET_IN_PRIVATE_FILE"
max_sandbox_timeout_seconds = 86400
[proxy]
# Only valid when this process can route to sandbox bridge IPs.
resolve_internal = true
[log]
level = "INFO"
[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.1.0"
[docker]
network_mode = "bridge"
port_range_min = 40000
port_range_max = 41000
no_new_privileges = true
pids_limit = 256
[store]
type = "sqlite"
path = "~/.opensandbox/gitnova.db"
[ingress]
mode = "direct"
[renew_intent]
enabled = false
