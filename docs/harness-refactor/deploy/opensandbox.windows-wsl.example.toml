# Merge into the generated release-1.1.0 config; do not overwrite private secrets.
# Windows + WSL2 + Docker Desktop Linux Engine. Development/private network only.
[server]
host = "0.0.0.0"
port = 8090
api_key = "REPLACE_WITH_RANDOM_SECRET_IN_PRIVATE_FILE"
max_sandbox_timeout_seconds = 86400
[proxy]
# Controls OpenSandbox -> Docker routing, NOT Mac -> OpenSandbox routing.
resolve_internal = false
[log]
level = "INFO"
[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.1.0"
[docker]
network_mode = "bridge"
# Enable ONE host_ip only after checking reachability from the WSL process:
# mirrored network with working Windows localhost forwarding:
# host_ip = "127.0.0.1"
# NAT: replace with actual Windows gateway/private address reachable from WSL:
# host_ip = "REPLACE_WITH_WSL_REACHABLE_WINDOWS_IP"
port_range_min = 40000
port_range_max = 41000
no_new_privileges = true
pids_limit = 256
[store]
type = "sqlite"
path = "~/.opensandbox/gitnova.db"
[ingress]
mode = "direct"
[renew_intent]
enabled = false
