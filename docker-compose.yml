version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: gitnova-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gitnova123}
      MYSQL_DATABASE: gitnova
    ports:
      - "3306:3306"
    volumes:
      - gitnova-mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: gitnova-redis
    ports:
      - "6379:6379"
    volumes:
      - gitnova-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: gitnova-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - gitnova-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  gitnova-mysql-data:
  gitnova-redis-data:
  gitnova-rabbitmq-data:
